<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>BOMBKI</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #terminal {
    height: 100%;
    width: 100%;
  }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="vendor/xterm.js"></script>
<script>
(function () {
  var term = new Terminal({
    convertEol: false,
    cursorBlink: true,
    fontFamily: '"DejaVu Sans Mono", "Liberation Mono", monospace',
    fontSize: 14,
    scrollback: 4000,
    allowProposedApi: true
  });
  term.open(document.getElementById('terminal'));

  // BOMBKI speaks CP437: ASCII plus the DOS box-drawing glyphs. The
  // Encoding Standard has no CP437, so TextDecoder cannot be used;
  // map the high half explicitly to keep rendering identical on
  // every device.
  var cp437 = [
    0x00c7, 0x00fc, 0x00e9, 0x00e2, 0x00e4, 0x00e0, 0x00e5, 0x00e7,
    0x00ea, 0x00eb, 0x00e8, 0x00ef, 0x00ee, 0x00ec, 0x00c4, 0x00c5,
    0x00e9, 0x00e6, 0x00c6, 0x00f4, 0x00f6, 0x00f2, 0x00fb, 0x00f9,
    0x00ff, 0x00d6, 0x00dc, 0x00a2, 0x00a3, 0x00a5, 0x20a7, 0x0192,
    0x00e1, 0x00ed, 0x00f3, 0x00fa, 0x00f1, 0x00d1, 0x00aa, 0x00ba,
    0x00bf, 0x2310, 0x00ac, 0x00bd, 0x00bc, 0x00a1, 0x00ab, 0x00bb,
    0x2591, 0x2592, 0x2593, 0x2502, 0x2524, 0x2561, 0x2562, 0x2556,
    0x2555, 0x2563, 0x2551, 0x2557, 0x255d, 0x255c, 0x255b, 0x2510,
    0x2514, 0x2534, 0x252c, 0x251c, 0x2500, 0x253c, 0x255e, 0x255f,
    0x255a, 0x2554, 0x2569, 0x2566, 0x2560, 0x2550, 0x256c, 0x2567,
    0x2568, 0x2564, 0x2565, 0x2559, 0x2558, 0x2552, 0x2553, 0x256b,
    0x256a, 0x2518, 0x250c, 0x2588, 0x2584, 0x258c, 0x2590, 0x2580,
    0x03b1, 0x00df, 0x0393, 0x03c0, 0x03a3, 0x03c3, 0x00b5, 0x03c4,
    0x03a6, 0x0398, 0x03a9, 0x03b4, 0x221e, 0x03c6, 0x03b5, 0x2229,
    0x2261, 0x00b1, 0x2265, 0x2264, 0x2320, 0x2321, 0x00f7, 0x2248,
    0x00b0, 0x2219, 0x00b7, 0x221a, 0x207f, 0x00b2, 0x25a0, 0x00a0
  ];

  function decode(bytes) {
    var text = '';
    for (var i = 0; i < bytes.length; i += 1) {
      var value = bytes[i];
      text += value < 0x80
        ? String.fromCharCode(value)
        : String.fromCharCode(cp437[value - 0x80]);
    }
    return text;
  }

  function base64ToBytes(encoded) {
    var binary = atob(encoded);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  function toBase64(text) {
    var bytes = new TextEncoder().encode(text);
    var binary = '';
    for (var i = 0; i < bytes.length; i += 1) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  window.__bombkiWrite = function (encoded) {
    term.write(decode(base64ToBytes(encoded)));
  };

  // xterm.js reports every key it sees, hardware and soft keyboard
  // alike, through onData, so this is the only input path needed.
  term.onData(function (data) {
    window.BombkiAndroid.sendInput(toBase64(data));
  });

  // Tell the Java side the terminal is live so it can replay whatever
  // the game printed while the page was still loading.
  window.BombkiAndroid.ready();

  term.focus();
})();
</script>
</body>
</html>
