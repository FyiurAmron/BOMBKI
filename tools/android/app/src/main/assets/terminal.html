<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>BOMBKI</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  /* The mic toggle is positioned against this, so it stays an overlay and
     the terminal keeps every one of its 80x25 columns. */
  body {
    position: relative;
  }
  #terminal {
    height: 100%;
    width: 100%;
  }
  #mic {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    right: calc(12px + env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    margin: 0;
    padding: 0;
    border: 1px solid #7f7f7f;
    border-radius: 22px;
    background: #1a1a1a;
    /* Idle means "reachable", listening means "armed". Dimmed rather than
       hidden so a player who expects the control can always find it. */
    opacity: 0.45;
    transition: opacity 120ms linear;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 10;
  }
  #mic[aria-pressed="true"] {
    opacity: 1;
    border-color: #e0e0e0;
  }
  #mic .dot {
    display: block;
    width: 14px;
    height: 14px;
    margin: 14px auto;
    border-radius: 7px;
    background: #7f7f7f;
  }
  #mic[aria-pressed="true"] .dot {
    background: #d04040;
  }
</style>
</head>
<body>
<div id="terminal"></div>
<button id="mic" type="button" aria-pressed="false" aria-label="Voice input">
  <span class="dot"></span>
</button>
<script src="vendor/xterm.js"></script>
<script>
(function () {
  var term = new Terminal({
    convertEol: false,
    cursorBlink: true,
    fontFamily: '"DejaVu Sans Mono", "Liberation Mono", monospace',
    fontSize: 14,
    scrollback: 4000,
    allowProposedApi: true
  });
  term.open(document.getElementById('terminal'));

  // BOMBKI speaks CP437: ASCII plus the DOS box-drawing glyphs. The
  // Encoding Standard has no CP437, so TextDecoder cannot be used;
  // map the high half explicitly to keep rendering identical on
  // every device.
  var cp437 = [
    0x00c7, 0x00fc, 0x00e9, 0x00e2, 0x00e4, 0x00e0, 0x00e5, 0x00e7,
    0x00ea, 0x00eb, 0x00e8, 0x00ef, 0x00ee, 0x00ec, 0x00c4, 0x00c5,
    0x00e9, 0x00e6, 0x00c6, 0x00f4, 0x00f6, 0x00f2, 0x00fb, 0x00f9,
    0x00ff, 0x00d6, 0x00dc, 0x00a2, 0x00a3, 0x00a5, 0x20a7, 0x0192,
    0x00e1, 0x00ed, 0x00f3, 0x00fa, 0x00f1, 0x00d1, 0x00aa, 0x00ba,
    0x00bf, 0x2310, 0x00ac, 0x00bd, 0x00bc, 0x00a1, 0x00ab, 0x00bb,
    0x2591, 0x2592, 0x2593, 0x2502, 0x2524, 0x2561, 0x2562, 0x2556,
    0x2555, 0x2563, 0x2551, 0x2557, 0x255d, 0x255c, 0x255b, 0x2510,
    0x2514, 0x2534, 0x252c, 0x251c, 0x2500, 0x253c, 0x255e, 0x255f,
    0x255a, 0x2554, 0x2569, 0x2566, 0x2560, 0x2550, 0x256c, 0x2567,
    0x2568, 0x2564, 0x2565, 0x2559, 0x2558, 0x2552, 0x2553, 0x256b,
    0x256a, 0x2518, 0x250c, 0x2588, 0x2584, 0x258c, 0x2590, 0x2580,
    0x03b1, 0x00df, 0x0393, 0x03c0, 0x03a3, 0x03c3, 0x00b5, 0x03c4,
    0x03a6, 0x0398, 0x03a9, 0x03b4, 0x221e, 0x03c6, 0x03b5, 0x2229,
    0x2261, 0x00b1, 0x2265, 0x2264, 0x2320, 0x2321, 0x00f7, 0x2248,
    0x00b0, 0x2219, 0x00b7, 0x221a, 0x207f, 0x00b2, 0x25a0, 0x00a0
  ];

  function decode(bytes) {
    var text = '';
    for (var i = 0; i < bytes.length; i += 1) {
      var value = bytes[i];
      text += value < 0x80
        ? String.fromCharCode(value)
        : String.fromCharCode(cp437[value - 0x80]);
    }
    return text;
  }

  function base64ToBytes(encoded) {
    var binary = atob(encoded);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  function toBase64(text) {
    var bytes = new TextEncoder().encode(text);
    var binary = '';
    for (var i = 0; i < bytes.length; i += 1) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  window.__bombkiWrite = function (encoded) {
    term.write(decode(base64ToBytes(encoded)));
  };

  // ---------------------------------------------------------------------
  // Input filtering
  //
  // BOMBKI is a 1999 DOS game: it compares every command against an
  // uppercase literal and never trims what it read, so a lowercase
  // letter or a diacritic makes the command silently miss. Both the
  // hardware keyboard and Android's voice input produce exactly that,
  // so anything printable is folded down to [A-Z0-9 .-] here - the
  // game's own vocabulary uses a hyphen and a dot inside words
  // (the POL-ELF race, MINI-BARMAN, D.J), so those two are kept
  // while every other punctuation mark is dropped. Voice input
  // additionally appends to the line the player already spoke,
  // which is why a trailing "ENTER" is handled below rather than
  // in the game.
  // ---------------------------------------------------------------------

  // Polish plus the Latin-1 letters speech engines emit that NFD cannot
  // split into a base letter and a combining mark.
  var FOLD = {
    'ł': 'l', 'Ł': 'L', 'đ': 'd', 'Đ': 'D',
    'ø': 'o', 'Ø': 'O', 'ß': 'ss', 'æ': 'ae', 'Æ': 'AE',
    'œ': 'oe', 'Œ': 'OE', 'þ': 'th', 'Þ': 'Th'
  };

  function fold(text) {
    var out = '';
    for (var i = 0; i < text.length; i += 1) {
      var ch = text[i];
      out += FOLD[ch] !== undefined ? FOLD[ch] : ch.normalize('NFD');
    }
    // Strip combining marks left by NFD, uppercase, then drop everything
    // the game cannot match on.
    return out.replace(/\p{Diacritic}/gu, '').toUpperCase();
  }

  // What the game is holding on its input line, as far as this filter can
  // tell: the printable characters sent since the last Enter. The game
  // cannot be asked what its line contains, and it compares commands with
  // `=` without trimming, so a stray space or a spoken "ENTER" makes the
  // command silently miss. Both are corrected by backing over them before
  // Enter, never by hoping they were not sent.
  var line = '';

  function push(text) {
    window.BombkiAndroid.sendInput(toBase64(text));
  }

  function erase(count) {
    if (count > 0) {
      push(new Array(count + 1).join('\b'));
    }
  }

  // Submits the line, first removing whatever would stop the game
  // from matching it: a spoken "ENTER" that already reached it,
  // the space separating it from the command, and any trailing
  // punctuation or space. The game echoes what it receives and
  // Crt honours BS as an erase.
  function submit() {
    var command = line.replace(/[-. ]*ENTER[-. ]*$/, '')
                      .replace(/[-. ]+$/, '');
    erase(line.length - command.length);
    line = '';
    push('\r');
  }

  // Closes a word that ended without an explicit Enter, which
  // is how a finished recognition phrase arrives. A spoken
  // "ENTER" submits here rather than waiting for a keystroke
  // the player believes they have already spoken. Anything
  // else trailing - the period a recogniser leaves on "kup
  // chleb." - is backed out, since the game compares the
  // line as it stands.
  function closeWord() {
    if (/ENTER[-. ]*$/.test(line)) {
      submit();
      return;
    }
    var command = line.replace(/[-. ]+$/, '');
    if (command !== line) {
      erase(line.length - command.length);
      line = command;
    }
  }

  // Keys the game receives, and the folded text of a voice phrase.
  function type(text) {
    for (var i = 0; i < text.length; i += 1) {
      var ch = text[i];
      // xterm.js delivers arrows and Home/End as one escape sequence; send
      // the remainder verbatim rather than folding its bytes as text.
      if (ch === '\x1b') {
        push(text.slice(i));
        return;
      }
      // Enter, either pressed or synthesised.
      if (ch === '\r' || ch === '\n') {
        submit();
        continue;
      }
      // The player's own backspace: it has to reach the game, and the
      // tracked line has to shrink with it or the counts drift apart.
      if (ch === '\b' || ch === '\x7f') {
        push(ch);
        line = line.slice(0, -1);
        continue;
      }
      // Other control characters pass through untouched.
      if (ch < ' ') {
        push(ch);
        continue;
      }
      var kept = fold(ch).replace(/[^A-Z0-9 .-]/g, '');
      if (kept === '') {
        continue;
      }
      if (kept === ' ') {
        // A spoken ENTER closes as soon as the space arrives, so
        // "ENTER" followed by more speech still submits first.
        if (/ENTER[-. ]*$/.test(line)) {
          submit();
        } else if (line !== '' && !/ $/.test(line)) {
          // A space with no word in front of it would lead the line,
          // and the game would read it as part of the command.
          push(' ');
          line += ' ';
        }
        continue;
      }
      // The game's own words contain a hyphen or a dot, so those
      // have to reach it; a line cannot start with one, and
      // doubling it serves nothing.
      if (/[.-]/.test(kept) && (line === '' || /[.-]$/.test(line))) {
        continue;
      }
      push(kept);
      line += kept;
    }
  }

  // xterm.js reports every key it sees, hardware and soft keyboard
  // alike, through onData, so this is the only input path needed.
  term.onData(function (data) {
    type(data);
  });

  // ---------------------------------------------------------------------
  // Scrolling
  //
  // The viewport reacts to the wheel and to PageUp/PageDown, but
  // touch is bound only to mouse-event emulation, so a finger drag
  // does not scroll. On a phone the bottom of a landscape 80x25
  // screen can sit under a rounded corner or the on-screen keyboard,
  // so a vertical drag scrolls the buffer here. The range is the
  // whole scrollback, and scrolling back to the bottom reattaches
  // to the live output.
  // ---------------------------------------------------------------------
  (function () {
    var drag = null;
    var pending = 0;

    function rowHeight() {
      return term.element.clientHeight / term.rows;
    }

    term.element.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 1) {
        drag = null;
        return;
      }
      drag = event.touches[0].clientY;
      pending = 0;
    }, { passive: true });

    term.element.addEventListener('touchmove', function (event) {
      if (drag === null || event.touches.length !== 1) {
        return;
      }
      pending += drag - event.touches[0].clientY;
      drag = event.touches[0].clientY;
      // Whole lines only, so the buffer and the scrollbar agree;
      // the remainder waits for the next move.
      var lines = Math.trunc(pending / rowHeight());
      if (lines !== 0) {
        term.scrollLines(lines);
        pending -= lines * rowHeight();
        // Keep the page from scrolling or zooming instead.
        event.preventDefault();
      }
    }, { passive: false });

    term.element.addEventListener('touchend', function () {
      drag = null;
    }, { passive: true });
  })();

  // A finished recognition result. Same folding and the same Enter
  // handling as the keyboard, plus the closing that a phrase has no
  // trailing keystroke to provide.
  window.__bombkiSay = function (encoded) {
    var text = new TextDecoder().decode(base64ToBytes(encoded));
    if (text === '') {
      return;
    }
    // The recogniser returns one utterance at a time and no
    // leading space, so a phrase that follows text already on
    // the line needs one, or the words glue together: "dawaj"
    // then "5 monet" would otherwise reach the game as
    // "DAWAJ5MONET", which is no command.
    if (line !== '' && !/ $/.test(line)) {
      push(' ');
      line += ' ';
    }
    type(text);
    closeWord();
  };

  // ---------------------------------------------------------------------
  // Voice toggle
  // ---------------------------------------------------------------------

  var mic = document.getElementById('mic');

  function setListening(listening) {
    mic.setAttribute('aria-pressed', listening ? 'true' : 'false');
    mic.setAttribute('aria-label', listening ? 'Voice input on' : 'Voice input off');
  }

  // pointerdown/pointerup rather than click: preventDefault on pointerdown
  // stops the tap from blurring the textarea xterm.js reads keystrokes from,
  // which would dismiss the soft keyboard mid-command. The click still
  // follows, so the toggle is driven from it.
  mic.addEventListener('pointerdown', function (event) {
    event.preventDefault();
  });
  mic.addEventListener('click', function () {
    var on = mic.getAttribute('aria-pressed') !== 'true';
    setListening(on);
    if (on) {
      window.BombkiAndroid.startVoice();
    } else {
      window.BombkiAndroid.stopVoice();
    }
  });

  // Tell the Java side the terminal is live so it can replay whatever
  // the game printed while the page was still loading.
  window.BombkiAndroid.ready();

  term.focus();

  // Voice is the point of the build on a phone, so it starts armed. The
  // mic permission prompt lands on top of the game rather than behind it,
  // and a refusal just leaves the keyboard as the input path.
  setListening(true);
  window.BombkiAndroid.startVoice();
})();
</script>
</body>
</html>
