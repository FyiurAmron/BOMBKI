name: fpc

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: FPC Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install FPC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fpc

      - name: Build BOMBKI (Linux x86_64)
        run: tools/build_fpc.py --target linux

      - name: Verify executable
        run: |
          set -e
          test -s build/fpc/BOMBKI-linux-x86_64
          file build/fpc/BOMBKI-linux-x86_64 | grep -q "ELF 64-bit"

      - name: Upload executable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bombki-linux-x86_64
          path: build/fpc/BOMBKI-linux-x86_64
          if-no-files-found: error

  windows-image:
    name: Win64 cross image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        # Fork pull requests get a read-only token, so they build
        # the image for this run alone instead of publishing it.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Reuse or build the image
        id: image
        run: |
          set -e
          # GHCR repository names must be lowercase.
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER,,}/bombki-fpc-cross"
          # The image is keyed by the content it is built from:
          # the Dockerfile and the setup script it runs, which
          # is all the image holds. Everything else under tools/
          # - the build scripts, the Android app - is mounted
          # over /src when the image runs, so changing it must
          # not rebuild a cross-compiler. A matching image is
          # reused as-is; only a missing one is built and
          # published, so the next run on the same content
          # reuses it.
          TAG=$( (sha256sum docker/fpc-cross/Dockerfile; \
                  sha256sum tools/setup_fpc_windows_cross.sh) \
                 | sha256sum | cut -c1-12 )
          if docker pull "$IMAGE:$TAG"; then
            echo "reusing $IMAGE:$TAG"
          else
            echo "no $IMAGE:$TAG yet; building it"
            docker build -f docker/fpc-cross/Dockerfile -t "$IMAGE:$TAG" .
            if [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "fork pull request: the image stays local"
            else
              docker push "$IMAGE:$TAG"
            fi
          fi
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

  windows-x86_64-cross:
    name: FPC Win64 cross-compile
    # Waits for the image job: either the matching image already
    # existed, or this run built and published it.
    needs: windows-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build BOMBKI (Win64)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            "${{ needs.windows-image.outputs.image }}" \
            tools/build_fpc.py --target windows --fpc fpc-win64

      - name: Verify executable
        run: |
          set -e
          test -s build/fpc/BOMBKI-windows-x86_64.exe
          file build/fpc/BOMBKI-windows-x86_64.exe | grep -qE "PE32\+ executable.*x86-64"

      - name: Upload executable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bombki-windows-x86_64
          path: build/fpc/BOMBKI-windows-x86_64.exe
          if-no-files-found: error

  android-image:
    name: Android cross image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        # Fork pull requests get a read-only token, so they build
        # the image for this run alone instead of publishing it.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Reuse or build the image
        id: image
        run: |
          set -e
          # GHCR repository names must be lowercase.
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER,,}/bombki-fpc-android"
          # The image is keyed by the content it is built from:
          # the Dockerfile and the setup script it runs, which
          # is all the image holds. Everything else under tools/
          # - the build scripts, the Android app - is mounted
          # over /src when the image runs, so changing it must
          # not rebuild a cross-compiler. A matching image is
          # reused as-is; only a missing one is built and
          # published, so the next run on the same content
          # reuses it.
          TAG=$( (sha256sum docker/fpc-android/Dockerfile; \
                  sha256sum tools/setup_fpc_android_cross.sh) \
                 | sha256sum | cut -c1-12 )
          if docker pull "$IMAGE:$TAG"; then
            echo "reusing $IMAGE:$TAG"
          else
            echo "no $IMAGE:$TAG yet; building it"
            docker build -f docker/fpc-android/Dockerfile -t "$IMAGE:$TAG" .
            if [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "fork pull request: the image stays local"
            else
              docker push "$IMAGE:$TAG"
            fi
          fi
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

  android-arm64:
    name: FPC Android arm64 APK
    # Waits for the image job: either the matching image already
    # existed, or this run built and published it.
    needs: android-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Build BOMBKI (Android arm64)
        # The cross image carries its own NDK copy; the one installed above is
        # what build_apk.py needs for the JNI helper.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            "${{ needs.android-image.outputs.image }}" \
            tools/build_fpc.py --target android --fpc fpc-android

      - name: Hand the build output back to the runner
        # The container runs as root, so everything it wrote under build/
        # is root-owned and the runner cannot create build/apk.
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Verify game library
        run: |
          set -e
          test -s build/fpc/BOMBKI-android-arm64-v8a.so
          file build/fpc/BOMBKI-android-arm64-v8a.so | grep -q "ELF 64-bit"
          file build/fpc/BOMBKI-android-arm64-v8a.so | grep -q "ARM aarch64"
          # The pty child finds the entry point by name.
          "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --dyn-syms build/fpc/BOMBKI-android-arm64-v8a.so | grep -q "BombkiMain"

      - name: Build APK
        # apksigner/d8 are shell wrappers that exec java off PATH.
        run: tools/build_apk.py

      - name: Verify APK
        run: |
          set -e
          test -s build/android/BOMBKI-debug-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging \
            build/android/BOMBKI-debug-arm64-v8a.apk | grep -q "package: name='io.github.fyiuramron'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging \
            build/android/BOMBKI-debug-arm64-v8a.apk \
            | grep -q "launchable-activity: name='io.github.fyiuramron.MainActivity'"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            build/android/BOMBKI-debug-arm64-v8a.apk
          unzip -l build/android/BOMBKI-debug-arm64-v8a.apk \
            | grep -q "lib/arm64-v8a/libbombki.so"

      - name: Upload APK and game library
        # Both files: the tagged release and the rolling latest release
        # publish the bare library next to the APK that wraps it.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bombki-android-arm64
          path: |
            build/android/BOMBKI-debug-arm64-v8a.apk
            build/fpc/BOMBKI-android-arm64-v8a.so
          if-no-files-found: error

  # Rolling release: one permanent "latest" release whose assets are
  # replaced in place on every push to main, so only the newest build is
  # ever available (releases/latest/download/... is what the pages site
  # links to). A failed build publishes nothing and leaves the previous
  # release untouched. Same idea as Bowcki's ci.yml release job.
  latest:
    name: Latest release
    needs: [linux-x86_64, windows-x86_64-cross, android-arm64]
    if: >-
      always() &&
      needs.linux-x86_64.result == 'success' &&
      needs.windows-x86_64-cross.result == 'success' &&
      needs.android-arm64.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      # Two main pushes in flight at once must not swap the release's
      # assets out of order; the newer run waits its turn.
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux build
        uses: actions/download-artifact@v6
        with:
          name: bombki-linux-x86_64
          path: dist

      - name: Download Win64 build
        uses: actions/download-artifact@v6
        with:
          name: bombki-windows-x86_64
          path: dist

      - name: Download Android build
        uses: actions/download-artifact@v6
        with:
          name: bombki-android-arm64
          path: dist

      - name: Checksums
        run: |
          set -e
          cd dist
          sha256sum BOMBKI-linux-x86_64 BOMBKI-windows-x86_64.exe \
            BOMBKI-android-arm64-v8a.so BOMBKI-debug-arm64-v8a.apk > SHA256SUMS
          ls -la

      - name: Prune stale assets
        # Anything on the release that the checksum step did not just
        # write is from an older build or an older name (asset names are
        # case-insensitive, so renames collide). Comma-wrapped list, built
        # here rather than in YAML. First run has no latest release, so
        # there is nothing to prune.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: latest
        run: |
          set -e
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "no $TAG release yet; nothing to prune"; exit 0; }
          keep=",BOMBKI-linux-x86_64,BOMBKI-windows-x86_64.exe,BOMBKI-android-arm64-v8a.so,BOMBKI-debug-arm64-v8a.apk,SHA256SUMS,"
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            case "$keep" in
              *",$name,"*) ;;
              *) echo "removing stale asset $name"
                 gh release delete-asset "$TAG" "$name" --yes ;;
            esac
          done

      - name: Publish rolling release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: latest
        run: |
          set -euo pipefail
          # GitHub keeps the original published_at on an edited release, so
          # the page's "released N ago" is the first build. Date the notes:
          # local time for humans, UTC alongside it to stay unambiguous.
          # The zone name picks CET or CEST on its own; LC_ALL=C keeps the
          # month name English regardless of the runner locale.
          TZ_NAME=Europe/Warsaw
          NOTES="Automated build of ${GITHUB_SHA} at $(TZ=$TZ_NAME LC_ALL=C date +'%Y-%m-%d %H:%M %Z') ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --latest
          fi
          # gh release edit --target leaves the tag where it is, so it
          # would keep pointing at the first published build. Move it.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          echo "tag $TAG -> $(git rev-parse "$TAG")"
          # Clobbering races GitHub's asset deletion, so retry briefly.
          upload() {
            local asset="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$asset" --clobber; then
                return 0
              fi
              echo "upload of $asset failed (attempt $attempt), retrying"
              sleep 10
            done
            echo "giving up on $asset"
            return 1
          }
          for asset in BOMBKI-linux-x86_64 BOMBKI-windows-x86_64.exe \
                       BOMBKI-android-arm64-v8a.so BOMBKI-debug-arm64-v8a.apk \
                       SHA256SUMS; do
            upload "$asset"
          done
          gh release view "$TAG" --json url,tagName --jq '"published " + .tagName + ": " + .url'
