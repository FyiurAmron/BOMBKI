name: fpc

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: FPC Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install FPC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fpc

      - name: Build BOMBKI (Linux x86_64)
        run: tools/build_fpc.py --target linux

      - name: Verify executable
        run: |
          set -e
          test -s build/fpc/BOMBKI-linux-x86_64
          file build/fpc/BOMBKI-linux-x86_64 | grep -q "ELF 64-bit"

      - name: Upload executable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bombki-linux-x86_64
          path: build/fpc/BOMBKI-linux-x86_64
          if-no-files-found: error

  windows-image:
    name: Win64 cross image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        # Fork pull requests get a read-only token, so they build
        # the image for this run alone instead of publishing it.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Reuse or build the image
        id: image
        run: |
          set -e
          # GHCR repository names must be lowercase.
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER,,}/bombki-fpc-cross"
          # The image is keyed by the content it is built from: the
          # Dockerfile and the tools/ it copies into itself. A matching
          # image is reused as-is; only a missing one is built and
          # published, so the next run on the same content reuses it.
          TAG=$( (sha256sum docker/fpc-cross/Dockerfile; \
                  git ls-files -z tools/ | sort -z | xargs -0 sha256sum) \
                 | sha256sum | cut -c1-12 )
          if docker pull "$IMAGE:$TAG"; then
            echo "reusing $IMAGE:$TAG"
          else
            echo "no $IMAGE:$TAG yet; building it"
            docker build -f docker/fpc-cross/Dockerfile -t "$IMAGE:$TAG" .
            if [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "fork pull request: the image stays local"
            else
              docker push "$IMAGE:$TAG"
            fi
          fi
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

  windows-x86_64-cross:
    name: FPC Win64 cross-compile
    # Waits for the image job: either the matching image already
    # existed, or this run built and published it.
    needs: windows-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build BOMBKI (Win64)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            "${{ needs.windows-image.outputs.image }}" \
            tools/build_fpc.py --target windows --fpc fpc-win64

      - name: Verify executable
        run: |
          set -e
          test -s build/fpc/BOMBKI-windows-x86_64.exe
          file build/fpc/BOMBKI-windows-x86_64.exe | grep -qE "PE32\+ executable.*x86-64"

      - name: Upload executable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bombki-windows-x86_64
          path: build/fpc/BOMBKI-windows-x86_64.exe
          if-no-files-found: error

  android-image:
    name: Android cross image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        # Fork pull requests get a read-only token, so they build
        # the image for this run alone instead of publishing it.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Reuse or build the image
        id: image
        run: |
          set -e
          # GHCR repository names must be lowercase.
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER,,}/bombki-fpc-android"
          # The image is keyed by the content it is built from: the
          # Dockerfile and the tools/ it copies into itself. A matching
          # image is reused as-is; only a missing one is built and
          # published, so the next run on the same content reuses it.
          TAG=$( (sha256sum docker/fpc-android/Dockerfile; \
                  git ls-files -z tools/ | sort -z | xargs -0 sha256sum) \
                 | sha256sum | cut -c1-12 )
          if docker pull "$IMAGE:$TAG"; then
            echo "reusing $IMAGE:$TAG"
          else
            echo "no $IMAGE:$TAG yet; building it"
            docker build -f docker/fpc-android/Dockerfile -t "$IMAGE:$TAG" .
            if [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "fork pull request: the image stays local"
            else
              docker push "$IMAGE:$TAG"
            fi
          fi
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

  android-arm64:
    name: FPC Android arm64 APK
    # Waits for the image job: either the matching image already
    # existed, or this run built and published it.
    needs: android-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Build BOMBKI (Android arm64)
        # The cross image carries its own NDK copy; the one installed above is
        # what build_apk.py needs for the JNI helper.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            "${{ needs.android-image.outputs.image }}" \
            tools/build_fpc.py --target android --fpc fpc-android

      - name: Hand the build output back to the runner
        # The container runs as root, so everything it wrote under build/
        # is root-owned and the runner cannot create build/apk.
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Verify game library
        run: |
          set -e
          test -s build/fpc/BOMBKI-android-arm64-v8a.so
          file build/fpc/BOMBKI-android-arm64-v8a.so | grep -q "ELF 64-bit"
          file build/fpc/BOMBKI-android-arm64-v8a.so | grep -q "ARM aarch64"
          # The pty child finds the entry point by name.
          "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --dyn-syms build/fpc/BOMBKI-android-arm64-v8a.so | grep -q "BombkiMain"

      - name: Build APK
        # apksigner/d8 are shell wrappers that exec java off PATH.
        run: tools/build_apk.py

      - name: Verify APK
        run: |
          set -e
          test -s build/android/BOMBKI-debug-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging \
            build/android/BOMBKI-debug-arm64-v8a.apk | grep -q "package: name='io.github.fyiuramron'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging \
            build/android/BOMBKI-debug-arm64-v8a.apk \
            | grep -q "launchable-activity: name='io.github.fyiuramron.MainActivity'"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            build/android/BOMBKI-debug-arm64-v8a.apk
          unzip -l build/android/BOMBKI-debug-arm64-v8a.apk \
            | grep -q "lib/arm64-v8a/libbombki.so"

      - name: Upload APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bombki-android-arm64
          path: build/android/BOMBKI-debug-arm64-v8a.apk
          if-no-files-found: error

  update-builds-json:
    name: Update builds.json (project page)
    # Only main builds feed the published page.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runs once every build in this workflow has succeeded.
    needs: [linux-x86_64, windows-x86_64-cross, android-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Emit the build links
        run: |
          set -e
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/latest/download"
          cat > builds.json <<EOF
          {
            "windows": "$BASE/BOMBKI-windows-x86_64.exe",
            "linux": "$BASE/BOMBKI-linux-x86_64",
            "android": "$BASE/BOMBKI-debug-arm64-v8a.apk"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update builds.json for the project page"
            git push
          fi
